<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AI QA Agent</title>
    <script>
      // A theme chosen with the toggle is applied before the first paint. Without one the system
      // setting decides (see tailwind.css).
      try {
        var saved = localStorage.getItem('ai-qa-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="client/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div
      id="rail-backdrop"
      class="fixed inset-0 z-30 hidden bg-scrim lg:hidden"
      data-action="close-rail"
    ></div>
    <div class="flex min-h-screen">
      <aside
        id="rail"
        class="rail flex w-[256px] shrink-0 flex-col gap-5 overflow-auto border-r border-line bg-ground px-3.5 py-5 text-ink lg:sticky lg:top-0 lg:h-screen max-lg:fixed max-lg:inset-y-0 max-lg:left-0 max-lg:z-40 max-lg:w-[min(300px,85vw)] max-lg:-translate-x-full max-lg:transition-transform max-lg:duration-200 max-lg:data-[open=true]:translate-x-0 max-lg:data-[open=true]:shadow-2xl motion-reduce:transition-none"
        aria-label="Menu"
      >
        <div class="flex items-center gap-2.5 px-1.5">
          <span
            aria-hidden="true"
            class="flex size-8 shrink-0 items-center justify-center rounded-[9px] bg-accent-fill font-display text-[13px] font-bold tracking-wide text-white"
            >QA</span
          >
          <span class="font-display text-lg font-bold tracking-tight text-white">AI QA Agent</span>
          <button
            id="rail-close"
            type="button"
            class="btn btn-text btn-icon ml-auto lg:hidden"
            aria-label="Close menu"
            data-action="close-rail"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div class="flex items-center gap-3 rounded-xl border border-line bg-surface p-3">
          <span
            id="project-mark"
            aria-hidden="true"
            class="flex size-[38px] shrink-0 items-center justify-center rounded-[10px] bg-accent-soft font-display text-[15px] font-bold text-accent"
          ></span>
          <span class="flex min-w-0 flex-col leading-snug">
            <span class="sr-only">Project</span>
            <span class="font-semibold break-words text-white" id="project">…</span>
            <span class="text-[13px] text-muted break-all" id="url"></span>
          </span>
        </div>
        <nav aria-label="Main" id="nav" class="flex flex-col gap-1"></nav>
        <div class="mt-auto" id="run-card"></div>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <header
          class="z-20 flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-line bg-surface/90 px-4 py-2.5 backdrop-blur md:sticky md:top-0 md:px-8"
        >
          <button
            id="rail-open"
            type="button"
            class="btn btn-icon lg:hidden"
            aria-label="Open menu"
            aria-controls="rail"
            aria-expanded="false"
            data-action="open-rail"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div id="topbar" class="contents"></div>
        </header>
        <main
          id="main"
          tabindex="-1"
          class="w-full max-w-[1360px] px-4 pb-20 pt-6 outline-none md:px-8 md:pt-8"
        >
          <p class="py-12 text-center text-muted">Loading…</p>
        </main>
      </div>
    </div>
    <dialog
      id="modal"
      class="m-auto w-[min(880px,calc(100vw-32px))] max-h-[calc(100vh-32px)] rounded-2xl border border-line bg-surface p-0 text-ink shadow-2xl max-sm:h-dvh max-sm:max-h-dvh max-sm:w-screen max-sm:max-w-none max-sm:rounded-none"
      aria-labelledby="m-title"
    ></dialog>
    <div
      id="toast"
      role="status"
      aria-live="polite"
      hidden
      class="fixed bottom-5 left-1/2 z-50 max-w-[calc(100vw-32px)] -translate-x-1/2 rounded-lg bg-ink px-4 py-3 text-sm font-semibold text-ground shadow-lg"
    ></div>
  </body>
</html>
